name: Bug report
description: Something in Lancer does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security flaw is never reported here: follow [SECURITY.md](https://github.com/lancer-systems/lancer/blob/main/SECURITY.md).

        Never paste a real AWS access key, secret key, session token, account ID or password. Make them up in the steps, the logs and any screenshot.
  - type: input
    id: version
    attributes:
      label: Version
      description: The Lancer release you installed, or the output of `git rev-parse HEAD` for a checkout.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part involved
      options:
        - Installer
        - Dashboard
        - API
        - Deployed AWS infrastructure
        - Documentation website
        - Other
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: AWS region
      placeholder: eu-west-1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
      placeholder: |
        1. Run `curl -fsSL https://get.lancer.run | bash`
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: What you expected, then what happened instead, with the exact message shown.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines only. Remove every key, token, password and account ID before pasting.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: No real credentials
      options:
        - label: This report, its logs and its screenshots hold no real AWS key, token, password or account ID.
          required: true
